
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل — أكاديمية محمد عيد سكر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E0620;
    --panel:#1B0E33;
    --panel-2:#241443;
    --gold:#D4AF37;
    --gold-soft:#E9CE7A;
    --purple:#4B0082;
    --cream:#F6F1E4;
    --muted:#B9AECF;
    --line:rgba(212,175,55,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(75,0,130,.55), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(212,175,55,.12), transparent 55%),
      var(--ink);
    color:var(--cream);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    line-height:1.7;
  }
  .wrap{max-width:920px;margin:0 auto;padding:48px 20px 80px}

  /* ---------- Hero ---------- */
  .hero{text-align:center;margin-bottom:44px}
  .logo{width:150px;height:150px;object-fit:contain;margin-bottom:18px;filter:drop-shadow(0 8px 24px rgba(212,175,55,.35))}
  .eyebrow{
    display:inline-block;font-family:'Cairo',sans-serif;font-weight:600;
    letter-spacing:.5px;color:var(--gold-soft);font-size:14px;
    border:1px solid var(--line);padding:6px 18px;border-radius:999px;margin-bottom:18px;
  }
  h1{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:clamp(28px,5vw,44px);
    margin:0 0 14px;background:linear-gradient(90deg,var(--gold-soft),var(--gold) 55%,#fff2c9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{color:var(--muted);font-size:16px;max-width:520px;margin:0 auto}

  /* ---------- Live ID card (signature element) ---------- */
  .idcard{
    margin:36px auto 0;max-width:420px;border-radius:18px;padding:26px 24px;
    background:linear-gradient(150deg,var(--panel-2),var(--panel) 70%);
    border:1px solid var(--line);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
    position:relative;overflow:hidden;
  }
  .idcard::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(135deg,rgba(212,175,55,.05) 0 2px, transparent 2px 22px);
    pointer-events:none;
  }
  .idcard .tag{font-family:'Cairo',sans-serif;font-weight:600;color:var(--gold-soft);font-size:12px;letter-spacing:1px}
  .idcard .name{font-family:'Cairo',sans-serif;font-weight:800;font-size:22px;margin:8px 0 2px;min-height:30px}
  .idcard .name.placeholder{color:var(--muted);font-weight:500;font-size:16px}
  .idcard .row{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--muted)}
  .idcard .id{font-family:'Cairo',sans-serif;font-weight:800;color:var(--gold);font-size:15px}

  /* ---------- Form ---------- */
  .section{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:26px 24px;margin-top:22px;
  }
  .section h2{
    font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;color:var(--gold-soft);
    margin:0 0 18px;display:flex;align-items:center;gap:8px;
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);
    color:var(--cream);border-radius:10px;padding:12px 14px;font-size:15px;
    font-family:inherit;transition:border-color .15s, background .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--gold);background:rgba(255,255,255,.06);
  }
  textarea{resize:vertical;min-height:80px}
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  select{appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9"><path d="M1 1l6 6 6-6" stroke="%23D4AF37" stroke-width="2" fill="none"/></svg>');background-repeat:no-repeat;background-position:left 14px center}

  /* ---------- Submit ---------- */
  .submit-row{margin-top:28px;text-align:center}
  button{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:16px;
    background:linear-gradient(90deg,var(--gold-soft),var(--gold));
    color:#1B0E33;border:none;border-radius:999px;padding:15px 48px;
    cursor:pointer;transition:transform .15s;
  }
  button:hover{transform:translateY(-2px)}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none}

  .msg{
    margin-top:18px;padding:16px 18px;border-radius:12px;font-size:14px;text-align:center;
    display:none;
  }
  .msg.show{display:block}
  .msg.success{background:rgba(70,180,120,.12);border:1px solid rgba(70,180,120,.4);color:#a9e8c6}
  .msg.duplicate{background:rgba(212,175,55,.1);border:1px solid var(--line);color:var(--gold-soft)}
  .msg.error{background:rgba(220,80,80,.1);border:1px solid rgba(220,80,80,.4);color:#f0a8a8}

  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
</style>
</head>

            <option>التمكين في خدمة المعتمرين</option>
            <option>دبلوم خدمات العمرة</option>
            <option>التسويق السياحي الدولي</option>
            <option>حكاية تسويق</option>
            <option>أخرى</option>
          </select>
        </div>
        <div class="field">
          <label>رقم الدفعة (لو معروف)</label>
          <input type="text" id="batch">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>💼 الخلفية العلمية والمهنية</h2>
      <div class="grid">
        <div class="field">
          <label>المؤهل العلمي</label>
          <select id="education">
            <option value="">اختر</option>
            <option>ثانوي</option>
            <option>دبلوم / معهد</option>
            <option>بكالوريوس / جامعي</option>
            <option>ماجستير</option>
            <option>دكتوراه</option>
          </select>
        </div>
        <div class="field">
          <label>الفئة العمرية</label>
          <select id="age">
            <option value="">اختر</option>
            <option>أقل من 21</option>
            <option>من 21 ل 35</option>
            <option>من 36 ل45</option>
            <option>من 46 ل 55</option>
            <option>فوق 55</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>العمل الحالي</label>
        <input type="text" id="job">
      </div>
    </div>

    <div class="section">
      <h2>🎯 الطموح المستقبلي</h2>
      <div class="field">
        <label>البرامج التدريبية التي تود حضورها مستقبلاً</label>
        <input type="text" id="futurePrograms">
      </div>
      <div class="field">
        <label>طموحك المستقبلي</label>
        <textarea id="futureAmbition"></textarea>
      </div>
    </div>

    <div class="submit-row">
      <button type="submit" id="submitBtn">إرسال التسجيل</button>
      <div class="msg" id="msgBox"></div>
    </div>

  </form>

  <div class="foot">أكاديمية محمد عيد سكر — mohamadeid.net</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKpEQ3_wjl-vOoaAMkdmZf2J2pm_3iaWI0Oa65AK4zZLgaAGOT99WeecZAYs9soPHg/exec";

  const nameArInput = document.getElementById('nameAr');
  const programInput = document.getElementById('program');
  const previewName = document.getElementById('previewName');
  const previewProgram = document.getElementById('previewProgram');
  const previewId = document.getElementById('previewId');

  nameArInput.addEventListener('input', () => {
    const v = nameArInput.value.trim();
    if (v) { previewName.textContent = v; previewName.classList.remove('placeholder'); }
    else { previewName.textContent = 'اسمك هيظهر هنا...'; previewName.classList.add('placeholder'); }
  });
  programInput.addEventListener('change', () => {
    previewProgram.textContent = 'البرنامج: ' + (programInput.value || '—');
  });

  const form = document.getElementById('regForm');
  const submitBtn = document.getElementById('submitBtn');
  const msgBox = document.getElementById('msgBox');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري الإرسال...';
    msgBox.className = 'msg';

    const payload = {
      nameAr: document.getElementById('nameAr').value.trim(),
      nameEn: document.getElementById('nameEn').value.trim(),
      whatsapp: document.getElementById('whatsapp').value.trim(),
      email: document.getElementById('email').value.trim(),
      country: document.getElementById('country').value.trim(),
      city: document.getElementById('city').value.trim(),
      program: document.getElementById('program').value,
      batch: document.getElementById('batch').value.trim(),
      education: document.getElementById('education').value,
      age: document.getElementById('age').value,
      job: document.getElementById('job').value.trim(),
      futurePrograms: document.getElementById('futurePrograms').value.trim(),
      futureAmbition: document.getElementById('futureAmbition').value.trim()
    };

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === 'success') {
        msgBox.textContent = '✅ ' + data.message;
        msgBox.classList.add('show', 'success');
        previewId.textContent = 'رقمك: ' + data.id;
        form.reset();
        previewName.textContent = 'اسمك هيظهر هنا...';
        previewName.classList.add('placeholder');
        previewProgram.textContent = 'البرنامج: —';
      } else if (data.status === 'duplicate') {
        msgBox.textContent = 'ℹ️ ' + data.message;
        msgBox.classList.add('show', 'duplicate');
        previewId.textContent = 'رقمك: ' + data.id;
      } else {
        msgBox.textContent = '⚠️ حصل خطأ: ' + data.message;
        msgBox.classList.add('show', 'error');
      }
    } catch (err) {
      msgBox.textContent = '⚠️ تعذر الاتصال بالسيستم. حاول مرة تانية.';
      msgBox.classList.add('show', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'إرسال التسجيل';
    }
  });
</script>
</body>
</html>
